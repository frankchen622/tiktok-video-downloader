<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE1D52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="40" fill="url(#grad2)"/>
  
  <!-- Download Icon (larger, centered) -->
  <g transform="translate(100, 70)">
    <!-- Circle background for icon -->
    <circle cx="0" cy="0" r="35" fill="rgba(255,255,255,0.2)"/>
    
    <!-- Arrow -->
    <path d="M 0,-18 L 0,18" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <path d="M -15,10 L 0,25 L 15,10" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- DLTK Text -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="white" letter-spacing="2">DLTK</text>
</svg>