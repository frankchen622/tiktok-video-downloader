<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE1D52;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE1D52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg3)"/>
  
  <!-- Video icon -->
  <rect x="60" y="50" width="100" height="100" rx="8" fill="white" stroke="url(#grad3)" stroke-width="3"/>
  <path d="M 95 75 L 95 125 L 135 100 Z" fill="url(#grad3)"/>
  
  <!-- Arrow -->
  <path d="M 170 100 L 190 100" stroke="url(#grad3)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 185 95 L 195 100 L 185 105" fill="none" stroke="url(#grad3)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Music note -->
  <circle cx="220" cy="120" r="12" fill="url(#grad3)"/>
  <circle cx="235" cy="115" r="12" fill="url(#grad3)"/>
  <rect x="220" y="80" width="4" height="40" fill="url(#grad3)"/>
  <rect x="235" y="75" width="4" height="40" fill="url(#grad3)"/>
  <path d="M 224 80 Q 235 75 239 75" fill="none" stroke="url(#grad3)" stroke-width="4"/>
  
  <!-- Sound waves -->
  <path d="M 200 85 Q 205 90 200 95" fill="none" stroke="url(#grad3)" stroke-width="2" opacity="0.6"/>
  <path d="M 195 80 Q 202 90 195 100" fill="none" stroke="url(#grad3)" stroke-width="2" opacity="0.4"/>
</svg>
