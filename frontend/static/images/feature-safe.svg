<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE1D52;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE1D52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg8)"/>
  
  <!-- Shield -->
  <path d="M 150 40 L 200 60 L 200 110 Q 200 150 150 170 Q 100 150 100 110 L 100 60 Z" 
        fill="white" stroke="url(#grad8)" stroke-width="3"/>
  
  <!-- Lock inside shield -->
  <rect x="135" y="95" width="30" height="35" rx="5" fill="url(#grad8)" opacity="0.8"/>
  <circle cx="150" cy="85" r="12" fill="none" stroke="url(#grad8)" stroke-width="3"/>
  <rect x="142" y="85" width="16" height="10" fill="white"/>
  
  <!-- Check mark in lock -->
  <path d="M 143 110 L 148 115 L 157 106" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Privacy symbols -->
  <circle cx="70" cy="100" r="8" fill="url(#grad8)" opacity="0.4"/>
  <circle cx="230" cy="100" r="8" fill="url(#grad8)" opacity="0.4"/>
  <path d="M 70 100 L 70 94 M 70 100 L 76 100" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M 230 100 L 230 94 M 230 100 L 224 100" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
