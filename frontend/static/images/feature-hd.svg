<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE1D52;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE1D52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg7)"/>
  
  <!-- Film reel -->
  <rect x="80" y="60" width="140" height="80" rx="8" fill="white" stroke="url(#grad7)" stroke-width="3"/>
  
  <!-- Film holes -->
  <circle cx="95" cy="75" r="5" fill="url(#grad7)"/>
  <circle cx="95" cy="100" r="5" fill="url(#grad7)"/>
  <circle cx="95" cy="125" r="5" fill="url(#grad7)"/>
  <circle cx="205" cy="75" r="5" fill="url(#grad7)"/>
  <circle cx="205" cy="100" r="5" fill="url(#grad7)"/>
  <circle cx="205" cy="125" r="5" fill="url(#grad7)"/>
  
  <!-- HD badge -->
  <rect x="120" y="85" width="60" height="30" rx="15" fill="url(#grad7)"/>
  <text x="150" y="107" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">HD</text>
  
  <!-- 4K badge -->
  <rect x="230" y="50" width="50" height="25" rx="12" fill="url(#grad7)"/>
  <text x="255" y="67" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">4K</text>
  
  <!-- Quality bars -->
  <rect x="120" y="150" width="15" height="30" rx="3" fill="url(#grad7)" opacity="0.4"/>
  <rect x="140" y="140" width="15" height="40" rx="3" fill="url(#grad7)" opacity="0.6"/>
  <rect x="160" y="130" width="15" height="50" rx="3" fill="url(#grad7)" opacity="0.8"/>
  <rect x="180" y="120" width="15" height="60" rx="3" fill="url(#grad7)"/>
</svg>
