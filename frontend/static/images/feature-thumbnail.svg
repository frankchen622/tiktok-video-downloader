<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE1D52;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE1D52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg4)"/>
  
  <!-- Image frame -->
  <rect x="75" y="40" width="150" height="120" rx="8" fill="white" stroke="url(#grad4)" stroke-width="3"/>
  
  <!-- Mountain landscape -->
  <path d="M 85 130 L 110 100 L 130 115 L 150 85 L 170 110 L 190 95 L 215 130 Z" fill="url(#grad4)" opacity="0.3"/>
  
  <!-- Sun -->
  <circle cx="190" cy="70" r="15" fill="url(#grad4)" opacity="0.5"/>
  
  <!-- Photo icon in corner -->
  <rect x="85" y="50" width="30" height="25" rx="3" fill="url(#grad4)" opacity="0.6"/>
  <circle cx="95" cy="60" r="3" fill="white"/>
  <path d="M 88 72 L 95 65 L 102 72 L 110 64" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Download arrow -->
  <circle cx="240" cy="150" r="20" fill="url(#grad4)"/>
  <path d="M 240 140 L 240 160" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 233 153 L 240 160 L 247 153" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
