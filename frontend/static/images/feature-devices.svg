<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE1D52;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE1D52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#bg5)"/>
  
  <!-- Desktop computer -->
  <rect x="60" y="50" width="100" height="70" rx="6" fill="white" stroke="url(#grad5)" stroke-width="3"/>
  <rect x="85" y="120" width="50" height="5" fill="url(#grad5)"/>
  <rect x="75" y="125" width="70" height="3" rx="1.5" fill="url(#grad5)" opacity="0.6"/>
  
  <!-- Mobile phone -->
  <rect x="140" y="70" width="50" height="80" rx="8" fill="white" stroke="url(#grad5)" stroke-width="3"/>
  <circle cx="165" cy="140" r="4" fill="url(#grad5)" opacity="0.5"/>
  
  <!-- Tablet -->
  <rect x="180" y="60" width="70" height="90" rx="6" fill="white" stroke="url(#grad5)" stroke-width="3"/>
  
  <!-- Connection lines -->
  <line x1="110" y1="90" x2="140" y2="100" stroke="url(#grad5)" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="165" y1="70" x2="200" y2="60" stroke="url(#grad5)" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  
  <!-- Check marks -->
  <circle cx="95" cy="60" r="10" fill="url(#grad5)"/>
  <path d="M 90 60 L 93 63 L 100 56" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <circle cx="160" cy="80" r="10" fill="url(#grad5)"/>
  <path d="M 155 80 L 158 83 L 165 76" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
