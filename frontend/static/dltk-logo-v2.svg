<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EE1D52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="40" fill="url(#grad1)"/>
  
  <!-- Download Icon -->
  <g transform="translate(100, 60)">
    <!-- Arrow pointing down -->
    <path d="M 0,-20 L 0,15" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <path d="M -12,8 L 0,20 L 12,8" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Tray/base -->
    <path d="M -20,25 L -20,30 L 20,30 L 20,25" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- DLTK Text -->
  <text x="100" y="140" font-family="Arial, sans-serif" font-size="48" font-weight="900" text-anchor="middle" fill="white">DLTK</text>
  
  <!-- .io text (smaller) -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="24" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,0.9)">.io</text>
</svg>