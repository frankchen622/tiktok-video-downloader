    <p>最后更新：2024年</p>
    <h2>1. 信息收集</h2>
    <p>我们不收集或存储您的个人信息。使用DLTK时，我们不会记录您的下载历史或个人数据。</p>
    <h2>2. Cookies</h2>
    <p>我们使用基本的Cookies来改善用户体验（如语言偏好）。详见<a href="/zh/cookie">Cookie政策</a>。</p>
    <h2>3. 第三方服务</h2>
    <p>我们使用Google Analytics进行匿名流量分析，不涉及个人身份识别。</p>
    <h2>4. 数据安全</h2>
    <p>所有数据传输均通过HTTPS加密。我们不存储您下载的视频内容。</p>
