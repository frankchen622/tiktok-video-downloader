<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .test-section {
      margin: 20px 0;
      padding: 20px;
      border: 2px solid #EE1D52;
      border-radius: 8px;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      background: #EE1D52;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    button:hover {
      background: #d91848;
    }
    #status {
      margin-top: 20px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 5px;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>多语言切换测试页面</h1>
  
  <div class="test-section">
    <h2>测试元素</h2>
    <p data-i18n="nav_video">Video</p>
    <p data-i18n="nav_mp3">MP3</p>
    <p data-i18n="hero_title">TikTok Video Downloader Without Watermark</p>
    <input type="text" data-i18n="input_placeholder" placeholder="Paste TikTok Video Link Here...">
  </div>
  
  <div class="test-section">
    <h2>语言切换</h2>
    <button onclick="testSwitch('en')">English</button>
    <button onclick="testSwitch('zh')">简体中文</button>
    <button onclick="testSwitch('es')">Español</button>
    <button onclick="testSwitch('pt')">Português</button>
    <button onclick="testSwitch('id')">Indonesia</button>
  </div>
  
  <div class="test-section">
    <h2>诊断信息</h2>
    <div id="status">等待测试...</div>
  </div>

  <script src="/static/i18n.js"></script>
  <script>
    function log(msg) {
      const status = document.getElementById('status');
      status.textContent += '\n' + msg;
      console.log(msg);
    }
    
    function testSwitch(lang) {
      log('\n=============================');
      log('测试切换到: ' + lang);
      log('=============================');
      
      // 检查 translations 对象
      if (typeof translations === 'undefined') {
        log('❌ translations 对象不存在!');
        return;
      }
      log('✅ translations 对象存在');
      
      // 检查目标语言数据
      if (!translations[lang]) {
        log('❌ 没有 ' + lang + ' 的翻译数据!');
        return;
      }
      log('✅ ' + lang + ' 翻译数据存在');
      log('   示例: nav_video = ' + translations[lang].nav_video);
      
      // 检查 i18n 对象
      if (typeof i18n === 'undefined') {
        log('❌ i18n 对象不存在!');
        return;
      }
      log('✅ i18n 对象存在');
      log('   当前语言: ' + i18n.currentLang);
      
      // 执行切换
      i18n.currentLang = lang;
      localStorage.setItem('dltk_lang', lang);
      log('✅ 语言已设置为: ' + lang);
      
      // 更新页面
      let count = 0;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        const text = translations[lang][key];
        
        if (text) {
          if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
            el.placeholder = text;
          } else {
            el.textContent = text;
          }
          count++;
        }
      });
      
      log('✅ 已更新 ' + count + ' 个元素');
      log('=============================\n');
    }
    
    // 页面加载时的诊断
    window.addEventListener('DOMContentLoaded', () => {
      log('页面加载完成');
      log('translations 存在: ' + (typeof translations !== 'undefined'));
      log('i18n 存在: ' + (typeof i18n !== 'undefined'));
      if (typeof i18n !== 'undefined') {
        log('当前语言: ' + i18n.currentLang);
      }
    });
  </script>
</body>
</html>
